name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. Raise it per job if something ever needs to write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must include the version declared in go.mod, otherwise that
        # declaration is an untested claim.
        go: ['1.24', '1.25', '1.26']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -coverprofile=cover.out ./...

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt'd:"; echo "$out"; exit 1; fi
